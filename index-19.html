<script>
const TYPES=[["sabah","Kahvaltı molası",15,"🥐"],["cay1","Çay kahve molası",20,"☕"],["yemek","Öğle yemeği",30,"🍽️"],["cay2","Çay kahve molası",20,"☕"],["aksam","Akşam yemeği",15,"🍲"]];
const ADMIN_PIN="1234"; // yönetici şifresi: değiştirin
const C=326.7;
const BR=[["optimum","Optimum"],["mavibahce","Mavibahçe"]];

const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const lbr=l=>l.branch||bid(S.staff[l.staffId]);
const ADMIN_TOPIC="mola-7fc53-yonetici-x9k2q7"; // ntfy yönetici konusu (tahmin edilmesin)
const rt=()=>"mola-"+Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,6);
let snd=false,_nt=0,rd="",sw="",sd=-1,stab="tom";const IMG={};try{snd=localStorage.getItem("mt_snd")==="1"}catch(e){}
let S={staff:{},active:{},logs:{},shifts:{}},me=null,db=null,mode="in",msg="",atab="live",cdel=null,fb="all",lb="optimum";
try{me=JSON.parse(localStorage.getItem("mt_me"))}catch(e){}
try{lb=localStorage.getItem("mt_lb")||"optimum"}catch(e){}
const today=()=>new Date().toLocaleDateString("sv");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hm=t=>new Date(t).toLocaleTimeString("tr",{hour:"2-digit",minute:"2-digit"});
const fmt=ms=>{const s=Math.abs(Math.round(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
const ini=n=>n.split(" ").filter(Boolean).map(w=>w[0]).slice(0,2).join("").toUpperCase();
const T=k=>TYPES.find(x=>x[0]===k);
const $=id=>document.getElementById(id);
const saveLocal=()=>{try{localStorage.setItem("mt_data",JSON.stringify(S))}catch(e){}};
async function put(c,id,d){try{if(db)await db.doc(c+"/"+id).set(d);else{S[c][id]=d;saveLocal()}}catch(e){msg="Kaydedilemedi."}render()}
async function del(c,id){try{if(db)await db.doc(c+"/"+id).delete();else{delete S[c][id];saveLocal()}}catch(e){msg="Silinemedi."}cdel=null;render()}
function setMe(v){me=v;try{v?localStorage.setItem("mt_me",JSON.stringify(v)):localStorage.removeItem("mt_me")}catch(e){}msg="";render()}
const logout=()=>setMe(null);
function login(){
  try{document.activeElement.blur()}catch(e){}
  if(mode==="adm"){const p=$("pin").value.trim();return p===ADMIN_PIN?setMe({role:"admin"}):(msg="Şifre yanlış",render())}
  if(mode==="reg"){const name=$("name").value.trim(),email=$("em").value.trim(),phone=$("ph").value.trim(),branch=lb;
    if(!name){msg="Ad soyad girin";return render()}
    if(email&&!/^\S+@\S+\.\S+$/.test(email)){msg="E-posta hatalı, düzeltin veya boş bırakın";return render()}
    if(phone&&phone.replace(/\D/g,"").length<10){msg="Telefon hatalı, düzeltin veya boş bırakın";return render()}
    lb=branch;try{localStorage.setItem("mt_lb",lb)}catch(e){}
    const id="s"+Date.now().toString(36);put("staff",id,{name,branch,email,phone,ntopic:rt()}).then(()=>setMe({role:"staff",id}));return}
  const w=$("who");if(!w||!w.value){msg="Listeden adınızı seçin";return render()}
  setMe({role:"staff",id:w.value})
}
function ntfy(topic,title,message,delay,email){if(!topic)return;try{fetch("https://ntfy.sh",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({topic,title,message,delay,priority:4,tags:["alarm_clock"]},email?{email}:{}))}).catch(()=>{})}catch(e){}}
function speak(t){try{if(!snd||!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(t);u.lang="tr-TR";u.rate=.95;const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith("tr"));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function togSnd(){snd=!snd;try{localStorage.setItem("mt_snd",snd?"1":"0")}catch(e){}if(snd)speak("Anons açık");render()}
function copyT(t){try{navigator.clipboard.writeText(t).then(()=>{msg="Kopyalandı";render();setTimeout(()=>{msg="";render()},1800)})}catch(e){}}
function startBreak(k){try{window.Notification&&Notification.permission==="default"&&Notification.requestPermission()}catch(e){}
  const s=S.staff[me.id],b=bid(s),full=durOf(k,b),n=s.name.split(" ")[0],L=S.logs[me.id+"_"+k+"_"+today()],pt=L&&L.done===false;
  if(L&&!pt)return;
  if(!pt&&!avail(k)){msg="Bu mola şu an açık değil";return render()}
  const prior=pt?(L.used||0):0,rem=full-prior/60000,sec=Math.max(10,Math.round(rem*60))+"s";
  buzz(60);
  put("active",me.id,{type:k,name:s.name,branch:b,start:Date.now(),dur:rem,full,prior});
  ntfy(s.ntopic,"Mola bitti",n+", molan doldu, işe dön.",sec,s.email);
  ntfy(ADMIN_TOPIC,"Mola doldu",s.name+" ("+bname(b)+") molası doldu.",sec)}
async function resetStaff(i){const d=today();for(const t of TYPES){const id=i+"_"+t[0]+"_"+d;if(S.logs[id])await del("logs",id)}if(S.active[i])await del("active",i);cdel=null;render()}
async function endFor(i){const a=S.active[i];if(!a)return;const end=Date.now(),d=today(),full=a.full||a.dur,used=(a.prior||0)+(end-a.start),done=used>=full*60000-1500;
  await put("logs",i+"_"+a.type+"_"+d,{staffId:i,name:a.name,branch:a.branch||bid(S.staff[i]),type:a.type,start:a.start,end,dur:full,full,used,done,date:d});
  await del("active",i)}
function contactCard(){let nc="";try{nc=localStorage.getItem("mt_nc")}catch(e){}if(nc==="1")return "";return `<div class="card"><b>✉️ İletişim bilgisi (isteğe bağlı)</b><div class="mut">E-posta eklersen mola bitince mail de gelir:</div><input id="c_em" type="email" placeholder="E-posta adresi"><input id="c_ph" type="tel" inputmode="tel" placeholder="Telefon"><button onclick="saveContact()">Kaydet</button><button class="line" style="margin-top:6px" onclick="try{localStorage.setItem('mt_nc','1')}catch(e){}render()">Şimdi değil</button></div>`}
function saveContact(){const email=$("c_em").value.trim(),phone=$("c_ph").value.trim();
  if(!email&&!phone){try{localStorage.setItem("mt_nc","1")}catch(e){}return render()}
  if((email&&!/^\S+@\S+\.\S+$/.test(email))||(phone&&phone.replace(/\D/g,"").length<10)){msg="E-posta veya telefon hatalı";try{document.activeElement.blur()}catch(e){}return render()}
  put("staff",me.id,Object.assign({},S.staff[me.id],{email,phone}))}
function wa(p){let d=String(p||"").replace(/\D/g,"");if(d.startsWith("0"))d="90"+d.slice(1);else if(d.length===10)d="90"+d;return d}
function contactLine(s){if(!s.phone&&!s.email)return "";return `<div class="mut">${esc(s.phone||"")}${s.phone&&s.email?" · ":""}${esc(s.email||"")}</div>${s.phone?`<div class="lk"><a href="tel:+${wa(s.phone)}">📞 Ara</a><a href="https://wa.me/${wa(s.phone)}">💬 WhatsApp</a></div>`:""}`}
function ntfyCard(t){return `<div class="card"><b>📲 Bildirim al</b><div class="mut">ntfy uygulamasını yükle, "Abone ol" de, bu konuyu yaz:</div><div class="tp">${esc(t||"hazırlanıyor...")}</div>${t?`<button class="line" onclick="copyT('${t}')">Kopyala</button>`:""}</div>`}
function adminCard(){return `<div class="card"><b>📲 Yönetici bildirimi</b><div class="mut">ntfy uygulamasında bu konuya abone ol; birinin mola süresi dolunca telefonun çalar:</div><div class="tp">${ADMIN_TOPIC}</div><button class="line" onclick="copyT('${ADMIN_TOPIC}')">Kopyala</button></div>`}
function notify(t,b){try{if(window.Notification&&Notification.permission==="granted"){navigator.serviceWorker.getRegistration().then(r=>r?r.showNotification(t,{body:b,icon:"hm192.png",vibrate:[300,150,300]}):new Notification(t,{body:b}))}}catch(e){}}
function loginHTML(){
  const ids=Object.keys(S.staff).filter(i=>bid(S.staff[i])===lb).sort((a,b)=>S.staff[a].name.localeCompare(S.staff[b].name,"tr"));
  const chips=()=>`<div class="tabs" style="margin:6px 0 10px">${BR.map(([m,l])=>`<button class="${lb===m?"on":""}" onclick="lb='${m}';try{localStorage.setItem('mt_lb',lb)}catch(e){}render()">${l}</button>`).join("")}</div>`;
  return `<div class="hero"><div><div class="sm">Personel</div><h1>☕ Mola Takip</h1><div class="sm">Giriş yapın veya kayıt olun</div></div></div><div class="wrap">
  <div class="tabs">${[["in","Giriş"],["reg","Kayıt ol"],["adm","Yönetici"]].map(([m,l])=>`<button class="${mode===m?"on":""}" onclick="mode='${m}';msg='';render()">${l}</button>`).join("")}</div>
  <div class="card">
  ${mode==="in"?`<div class="mut">Şube</div>${chips()}${ids.length?`<div class="mut" style="margin-top:8px">Adın</div><select id="who">${ids.map(i=>`<option value="${i}">${esc(S.staff[i].name)}</option>`).join("")}</select>`:`<div class="mut" style="margin-top:8px">Bu şubede kayıtlı personel yok. "Kayıt ol" sekmesini kullanın.</div>`}`:""}
  ${mode==="reg"?`<div class="mut">Şube</div>${chips()}<input id="name" placeholder="Ad soyad"><input id="em" type="email" placeholder="E-posta (isteğe bağlı)"><input id="ph" type="tel" inputmode="tel" placeholder="Telefon (isteğe bağlı)">`:""}
  ${mode==="adm"?`<input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="Yönetici şifresi">`:""}
  <div class="err">${esc(msg)}</div><button onclick="login()">${mode==="reg"?"Kaydol":"Giriş yap"}</button></div>
  ${db?"":`<div class="mut">Çevrimdışı: veriler yalnızca bu cihazda saklanır.</div>`}</div>`}
function staffHTML(){
  const s=S.staff[me.id];if(!s)return logout(),"";
  if(!s.ntopic&&!_nt){_nt=1;put("staff",me.id,Object.assign({},s,{ntopic:rt()}))}
  const act=S.active[me.id],d=today(),done=TYPES.filter(t=>{const L=S.logs[me.id+"_"+t[0]+"_"+d];return L&&L.done!==false}).length;
  let h=`<div class="hero"><div><div class="sm">${bname(bid(s))} · ${new Date().toLocaleDateString("tr",{weekday:"long",day:"numeric",month:"long"})}</div><h1>Merhaba, ${esc(s.name.split(" ")[0])}</h1><div class="sm">Bugün ${done}/${TYPES.length} mola kullandın</div></div><div class="hb"><button class="g" onclick="togSnd()">${snd?"🔊":"🔇"}</button><button class="g" onclick="logout()">Çıkış</button></div></div><div class="wrap"><div class="err">${esc(msg)}</div>`;
  if(act){const t=T(act.type),e=act.start+act.dur*60000;
    h+=`<div class="card ringcard"><div class="mut">${t[3]} ${t[1]} · ${Math.ceil(act.dur)} dk</div><div class="ringbox"><svg viewBox="0 0 120 120"><circle class="trk" cx="60" cy="60" r="52"/><circle class="prg" data-ring data-s="${act.start}" data-e="${e}" cx="60" cy="60" r="52"/></svg><div class="rt" data-end="${e}">--:--</div></div><div class="mut">Molanı yönetici bitirecek.</div></div>`}

    const sub=pt?`${left} dk kaldı, devam edebilirsin`:`${durOf(t[0],bid(s))} dakika${WINL[t[0]]?" · "+WINL[t[0]]:""}`,st=dn?"✓ "+hm(L.start):pt?"Devam et":(!ok?"Kapalı":(act?"":"Başlat"));
    return `<button class="bk ${dn?"done":""}" ${dn||act||!ok?"disabled":""} onclick="startBreak('${t[0]}')"><span class="ic">${t[3]}</span><span class="nm">${t[1]}<small>${sub}</small></span><span class="st">${st}</span></button>`}).join("")+(s.email||s.phone?"":contactCard())+ntfyCard(s.ntopic)+`</div>`;
  return h}
const WORK_H=9,DN=["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"],pad=n=>String(n).padStart(2,"0");
const addD=(ds,n)=>{const x=new Date(ds+"T12:00:00");x.setDate(x.getDate()+n);return x.toLocaleDateString("sv")};
const dIdx=ds=>(new Date(ds+"T12:00:00").getDay()+6)%7;
const wkOf=ds=>addD(ds,-dIdx(ds));
const tmin=t=>{const p=t.split(":").map(Number);return p[0]*60+p[1]};
const shiftOf=(sid,ds)=>{const w=S.shifts[wkOf(ds)];return(w&&w.rows&&w.rows[sid]&&w.rows[sid][dIdx(ds)])||""};
const locOf=(sid,ds)=>{const w=S.shifts[wkOf(ds)];return(w&&w.locs&&w.locs[sid]&&w.locs[sid][dIdx(ds)])||""};
function nt(v){v=String(v==null?"":v).trim().toLowerCase();if(!v||/^(-|–|—|x|i|izin|izinli|off|yok)$/.test(v))return "";const m=v.match(/^(\d{1,2})(?:[:.]?(\d{2}))?$/);if(!m)return null;const h=+m[1],mi=m[2]?+m[2]:0;if(h>24||mi>59||(h===24&&mi>0))return null;return pad(h)+":"+pad(mi)}
function parseSh(v){if(!v)return null;let a,b;if(v.indexOf("-")>0){const p=v.split("-");a=p[0];b=p[1]}else if(/^\d\d:\d\d$/.test(v)){a=v;const m=(tmin(v)+WORK_H*60)%1440;b=pad(Math.floor(m/60))+":"+pad(m%60)}else return null;

  let n=0;try{n=+sessionStorage.getItem("mt_rl")||0;sessionStorage.setItem("mt_rl",n+1)}catch(e){}
  if(n<1)location.reload();else location.replace(location.pathname+"?v="+m[1])}catch(e){}}
setInterval(chkVer,60000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)chkVer()});setTimeout(chkVer,4000);
