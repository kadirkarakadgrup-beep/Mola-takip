<!DOCTYPE html>
<html><head><base target="_top"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#0f172a;color:#f1f5f9;padding:12px;min-height:100vh}
.top{display:flex;gap:8px;margin-bottom:10px}
.tab{flex:1;padding:12px;border:0;border-radius:10px;background:#1e293b;color:#94a3b8;font-size:15px;font-weight:600}
.tab.on{background:#2563eb;color:#fff}.tab.m.on{background:#7c3aed}
#st{font-size:13px;color:#fbbf24;margin:0 0 8px}
#an{display:none;background:#4c1d95;color:#fff;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:700;margin-bottom:10px}
.dt{font-size:13px;color:#cbd5e1;font-weight:700;margin:0 2px 8px}
.sec{grid-column:1/-1;font-size:12px;font-weight:700;letter-spacing:.08em;color:#94a3b8;margin:6px 2px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.card{background:#1e293b;border-radius:14px;padding:10px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:6px;min-height:165px;text-align:center}
.card.offc{opacity:.55}.card.on{border-color:#22c55e}.card.pz{border-color:#eab308}.card.turn{border-color:#facc15;box-shadow:0 0 0 2px #facc1566}
.sr{display:inline-block;background:#334155;border-radius:50%;width:22px;height:22px;line-height:22px;font-size:12px;margin-right:5px;vertical-align:middle}
.nm{font-weight:800;font-size:16px;line-height:1.15;word-break:break-word}
.sub{font-size:12px;color:#94a3b8}
.tm{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;color:#4ade80;line-height:1}
.card.pz .tm{color:#facc15}
.card.late{border-color:#ef4444;animation:blink .8s infinite}.card.late .tm{color:#fff}
.lt{display:none;font-weight:800;font-size:13px;color:#fff}.card.late .lt{display:block}
@keyframes blink{0%,100%{background:#dc2626}50%{background:#450a0e}}
body.alarm{animation:bg .8s infinite}
@keyframes bg{0%,100%{background:#0f172a}50%{background:#5b0b0b}}
button.a,a.a{border:0;border-radius:10px;padding:12px 14px;font-weight:700;font-size:14px;color:#fff;background:#16a34a}
a.a{display:block;text-align:center;text-decoration:none}a.a.wa{background:#128c7e}
.btns .k-yemek{background:#2563eb}.btns .k-kahvalti,.btns .k-aksam{background:#9333ea}
button.a.end{background:#dc2626}button.a.x{background:#475569;padding:10px 12px}
button.a.off{background:#b45309}button.a.ed{background:#0e7490;padding:10px 12px}button.a.an{background:#7c3aed}
.btns{display:flex;flex-direction:column;gap:6px;width:100%}.btns button,.btns a{width:100%}
.btns button small{display:block;font-size:12px;font-weight:600;opacity:.9;margin-top:2px}.fin{font-weight:800;color:#4ade80;padding:10px 0}
.ib{display:flex;flex-wrap:wrap;gap:4px;width:100%}
.ib button{flex:1 1 34px;padding:8px 0;font-size:16px;border:0;border-radius:8px;color:#fff;background:#475569}
.ib .ed{background:#0e7490}.ib .off,.ib .rs{background:#b45309}
.bar{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}.bar button{flex:1}
details.tl{margin:0 0 10px;background:#1e293b;border-radius:12px;padding:10px}
details.tl summary{font-weight:700;cursor:pointer;color:#cbd5e1}details.tl .bar{margin:10px 0 0}
.legend{font-size:11px;color:#94a3b8;margin:0 2px 8px}
.chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.chip{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;background:#166534;color:#bbf7d0}
.chip.cur{background:transparent;border:2px solid #facc15;color:#facc15;padding:0 6px}
.chip.left{background:#334155;color:#e2e8f0}.chip.offb{background:#b45309;color:#fff}
.chip.errc{background:#fff;color:#b91c1c}.chip.okc{background:#fff;color:#166534}
.err{background:#7f1d1d;padding:12px;border-radius:10px;font-size:14px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}.ov[hidden]{display:none}
.mb{background:#1e293b;border-radius:16px;padding:20px;width:100%;max-width:380px;max-height:90vh;overflow:auto}
.mb h3{margin:0 0 12px;font-size:17px;word-break:break-word;white-space:pre-line}
.mb label{display:block;font-size:13px;color:#94a3b8;margin:10px 0 4px}
.mb input,.mb textarea{font-family:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#fff;font-size:16px}
.mbt{display:flex;gap:8px;margin-top:16px}.mbt button{flex:1}
</style></head>
<body>
<div class="top" id="br"></div><div class="top" id="md"></div><div id="an"></div>
<div class="bar" id="tools"></div><div id="st"></div><div id="list"></div><div id="rpt"></div><input type="file" id="rf" accept="image/*" hidden>
<div class="ov" id="ov" hidden><div class="mb"><h3 id="mt"></h3><div id="mf"></div>
<div class="mbt"><button class="a x" id="mc">İptal</button><button class="a" id="mo">Tamam</button></div></div></div>
<script>
let B='opt',M='g',PIN='',D=null,off=0,alerted={},chk={},ac=null,TO=false,retry=null,ANONS=false,WL=null;
const BR={mavi:'Mavi Bahçe',opt:'Optimum'};
const $=id=>document.getElementById(id);
const p=n=>String(n).padStart(2,'0');
const esc=t=>String(t||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const hm=t=>new Date(t).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
const emsg=e=>(e&&e.message)?e.message:'Bağlantı sorunu';
const run=()=>google.script.run.withFailureHandler(e=>msg(emsg(e))).withSuccessHandler(load);
const dm=x=>Number(x&&typeof x==='object'?x.m:x)||0;
const usedOf=s=>(s.done||[]).filter(x=>x&&typeof x==='object'&&(x.k==='mola'||x.k==='yemek')).reduce((a,x)=>a+dm(x),0);
const cnt=(s,k)=>(s.done||[]).filter(x=>x&&x.k===k).length;
const endOf=a=>a.start+(a.pt||0)+a.dur*60000;
const kn=k=>D.names[k]||k||'';

function ask(title,fields,cb,okText){
  $('mt').textContent=title;
  $('mf').innerHTML=fields.map((f,i)=>f.type=='textarea'?`<label>${f.label}</label><textarea id="f${i}" rows="9" placeholder="Ahmet Polat\t08:00-16:00\t08:00-16:00\t\t...">${esc(f.val)}</textarea>`:`<label>${f.label}</label><input id="f${i}" type="${f.type||'text'}" value="${esc(f.val)}" autocomplete="off" ${f.type=='password'?'inputmode="numeric"':''}>`).join('');
  $('mo').textContent=okText||'Tamam';$('mc').textContent='İptal';$('mc').style.display='';$('ov').hidden=false;
  if(fields.length)setTimeout(()=>$('f0').focus(),50);
  $('mc').onclick=()=>$('ov').hidden=true;
  $('mo').onclick=()=>{const v=fields.map((f,i)=>$('f'+i).value);$('ov').hidden=true;cb(v);};
}
function msg(t){ask(t,[],()=>{},'Tamam');$('mc').style.display='none';}

function load(){
  google.script.run
    .withFailureHandler(e=>{
      const m=emsg(e);
      if(D)$('st').textContent='⚠ '+m+' - yeniden deneniyor…';
      else{head();$('list').innerHTML='<div class="err">Hata: '+esc(m)+'<br>Yeniden deneniyor…</div>';}
      clearTimeout(retry);retry=setTimeout(load,3000);
    })
    .withSuccessHandler(d=>{
      $('st').textContent='';
      if(!d||!d.names){head();$('list').innerHTML='<div class="err">Code.gs eski sürüm. Yeniden yapıştırıp YENİ SÜRÜM olarak dağıtın.</div>';return;}
      D=d;off=d.now-Date.now();
      try{draw();}catch(e){$('list').innerHTML='<div class="err">Çizim hatası: '+esc(emsg(e))+'</div>';}
    }).getState(B,M=='y'?PIN:'');
}

function head(){
  $('br').innerHTML=Object.keys(BR).map(k=>`<button class="tab ${k==B?'on':''}" onclick="B='${k}';load()">${BR[k]}</button>`).join('');
  $('md').innerHTML=`<button class="tab ${M=='g'?'on':''}" onclick="setM('g')">👤 Garson</button><button class="tab m ${M=='y'?'on':''}" onclick="setM('y')">🔑 Yönetici</button>`;
  $('tools').innerHTML=M=='y'
    ?`<button class="a" onclick="add()">+ Personel Ekle</button><button class="a x" onclick="reset()">Günü Sıfırla</button><button class="a ed" onclick="shiftUp()">📅 Vardiya Yükle</button><button class="a ed" onclick="rptPick()">📷 Satış Raporu</button>
      <button class="a an" onclick="anons()">${ANONS?'📢 Anons Modu: AÇIK (kapat)':'📢 Anons Modu'}</button>
      <details class="tl" style="width:100%" ${TO?'open':''} ontoggle="TO=this.open"><summary>⚙ Araçlar</summary><div class="bar">
        <button class="a ed" onclick="code('yonetici','Yönetici')">📲 Yönetici Kodu</button>
        <button class="a off" onclick="test('yonetici')">🔔 Test Bildirimi</button>
        <button class="a off" onclick="mailTest()">✉ Mail Testi</button>
        <button class="a ed" onclick="tok()">🔑 Ntfy Token</button>
        <button class="a ed" onclick="voiceTest()">🔊 Anons Testi</button><button class="a off" onclick="shiftClr()">🗑 Vardiyayı Temizle</button></div></details>`
    :'';
  $('an').style.display=(ANONS&&M=='y')?'block':'none';
  $('an').textContent='📢 Anons modu açık: bu cihazın ekranı açık ve şarjda kalmalı. Molası dolan kişiye sesli seslenilir.';
}

function setM(m){
  if(m=='y'&&!PIN){
    ask('Yönetici şifresi',[{label:'Şifre',type:'password'}],v=>{
      google.script.run.withFailureHandler(e=>msg(emsg(e))).withSuccessHandler(ok=>{if(ok){PIN=v[0];M='y';load();}else msg('Şifre yanlış');}).checkPin(v[0]);
    },'Giriş');
  }else{M=m;load();}
}

function tile(s){
  const left=Math.max(0,D.total-usedOf(s)),a=s.active;
  let chips=(s.done||[]).map(x=>typeof x==='object'?`<span class="chip">✓ ${esc(kn(x.k))} ${hm(x.t)}–${hm(x.e||x.t+x.m*60000)} (${x.m} dk)</span>`:`<span class="chip">✓ ${x} dk</span>`).join('');
  if(a)chips+=`<span class="chip cur">${esc(a.n)} ${a.dur} dk${a.paused?' · ⏸ duraklatıldı':''}</span><span class="chip cur">${hm(a.start)} çıktı${a.paused?'':' · '+hm(endOf(a))+' dönüş'}</span>`;
  chips+=`<span class="chip left">Kalan ${left} dk</span>`;
  if(s.shTxt)chips+=`<span class="chip left">🕗 ${s.shTxt.replace('-','–')}</span>`;
  if(s.turn&&!a)chips+='<span class="chip cur">⏭ SIRADAKİ</span>';
  if(M=='y'&&a){
    if(a.sent)chips+=`<span class="chip okc">🔔 gitti ${hm(a.sent)}</span>`;
    else if(a.sched)chips+=`<span class="chip okc">🔔 ${hm(endOf(a))}'de</span>`;
    else if(a.err)chips+=`<span class="chip errc" onclick="showErr('${s.id}','err')">⚠ bildirim</span>`;
    if(a.mailErr)chips+=`<span class="chip errc" onclick="showErr('${s.id}','mailErr')">✉ hata</span>`;
  }
  if(s.off)chips=`<span class="chip offb">İZİNLİ</span>`;
  let btns='';
  if(M=='g'&&!a&&!s.off){
    btns=!(s.opts||[]).length?(s.bitti?'<div class="fin">✅ Molalar bitti</div>':'<span class="sub">Şu an mola saati değil</span>')
      :'<div class="btns">'+s.opts.map(o=>`<button class="a k-${o.k}" onclick="startB('${s.id}','${o.k}')"><b>${esc(o.n)}</b><small>${o.d} dk${o.d<o.full?' (devam)':''}</small></button>`).join('')+'</div>';
  }
  if(M=='y'){
    if(a){
      if(s.phone){
        const num=String(s.phone).replace(/[^\d+]/g,''),wa=num.replace('+',''),txt=encodeURIComponent(nice(s.name)+', molan bitti. Çabuk postana geç!');
        btns+=`<div class="btns"><a class="a" href="tel:${num}" target="_top">📞 Ara</a><a class="a wa" href="https://wa.me/${wa}?text=${txt}" target="_blank" rel="noopener">💬 WhatsApp</a></div>`;
      }else btns+='<div class="sub">📵 Telefon yok (✏️ ile ekleyin)</div>';
      btns+=`<div class="btns"><button class="a off" onclick="${a.paused?'resumeB':'pauseB'}('${s.id}')">${a.paused?'▶ Devam':'⏸ Durdur'}</button><button class="a end" onclick="endB('${s.id}')">Molayı Bitir</button></div>`;
    }
    btns+=`<div class="ib"><button class="ed" title="Düzenle" onclick="edit('${s.id}')">✏️</button>`+
      `<button class="off" title="İzinli" onclick="toggleOff('${s.id}',${s.off?'false':'true'})">${s.off?'✅':'🚫'}</button>`+
      `<button title="Kod" onclick="code('${s.id}','${esc(s.name).replace(/'/g,'')}')">📲</button>`+
      `<button title="Geçmiş" onclick="hist('${s.id}')">📅</button>`+
      `<button title="Molasını sıfırla" onclick="resetP('${s.id}')">♻️</button>`+
      (a?`<button class="rs" title="Tekrar gönder" onclick="resend('${s.id}')">🔔</button>`:'')+
      `<button title="Sil" onclick="del('${s.id}')">🗑</button></div>`;
  }
  return `<div class="card ${a?'on':''} ${s.off||(s.on===false&&!a)?'offc':''} ${s.turn&&!a?'turn':''}" data-id="${s.id}">
    <div class="nm">${s.sira&&s.on!==false?'<span class="sr">'+s.sira+'</span>':''}${esc(s.name)}</div>${a?'<div class="tm">--:--</div>':''}
    <div class="chips">${chips}</div><div class="lt">⚠ MOLAN BİTTİ!</div>${btns}</div>`;
}

function draw(){
  head();
  const S=D.staff.filter(s=>M=='y'||(!s.off&&(s.on!==false||s.active)));
  const act=S.filter(s=>s.active).sort((a,b)=>a.active.start-b.active.start);
  const rest=S.filter(s=>!s.active&&!s.off&&s.on!==false).sort((a,b)=>(a.sira||999)-(b.sira||999)||a.name.localeCompare(b.name,'tr'));
  const nos=S.filter(s=>!s.active&&!s.off&&s.on===false).sort((a,b)=>a.name.localeCompare(b.name,'tr'));
  const offs=S.filter(s=>!s.active&&s.off).sort((a,b)=>a.name.localeCompare(b.name,'tr'));
  let h='<div class="dt">📅 '+new Date().toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric',weekday:'long'})+'</div>';
  if(M=='y')h+='<div class="legend">✏️ düzenle · 🚫 izinli · 📲 kod · 📅 geçmiş · ♻️ molayı sıfırla · 🔔 tekrar gönder · 🗑 sil</div>';
  h+='<div class="grid">';
  if(act.length)h+='<div class="sec">MOLADA</div>'+act.map(tile).join('');
  if(rest.length)h+=(act.length?'<div class="sec">PERSONEL</div>':'')+rest.map(tile).join('');
  if(nos.length)h+='<div class="sec">VARDİYA DIŞI</div>'+nos.map(tile).join('');
  if(offs.length)h+='<div class="sec">İZİNLİ</div>'+offs.map(tile).join('');
  h+='</div>';
  $('list').innerHTML=S.length?h:'<p class="sub">Bu şubede personel yok. Yönetici panelinden ekleyin.</p>';
  if(M=='y'&&!RPL){RPL=1;rptLoad();}
  rptDraw();
  tick();
}

function showErr(id,k){const s=D.staff.find(x=>x.id==id),a=s&&s.active;if(a&&a[k])msg((k=='err'?'Bildirim hatası':'Mail hatası')+':\n'+a[k]);}
function startB(id,k){
  const s=D.staff.find(x=>x.id==id),o=s.opts.find(x=>x.k==k);
  ask(o.n+' ('+o.d+' dk) başlatılsın mı?',[],()=>{perm(true);run().startBreak(id,k);},'Başlat');
}
function endB(id){run().endBreak(id,PIN);}
function pauseB(id){run().pauseBreak(id,PIN);}
function resumeB(id){run().resumeBreak(id,PIN);}
function resend(id){run().resendNotify(id,PIN);}
function add(){
  ask('Personel Ekle',[{label:'Personel adı'},{label:'E-posta (isteğe bağlı)',type:'email'},{label:'Telefon (isteğe bağlı)',type:'tel'}],v=>{
    if(!v[0].trim())return;run().addStaff(B,v[0],v[1],v[2],PIN);},'Ekle');
}
function edit(id){
  const s=D.staff.find(x=>x.id==id);
  ask('Personeli Düzenle',[{label:'Personel adı',val:s.name},{label:'E-posta',type:'email',val:s.email},{label:'Telefon',type:'tel',val:s.phone}],v=>{
    if(!v[0].trim())return;run().updateStaff(id,v[0],v[1],v[2],PIN);},'Kaydet');
}
function toggleOff(id,flag){
  const s=D.staff.find(x=>x.id==id);
  if(flag)ask(s.name+' izinli yapılsın mı? Garson panelinde görünmeyecek.',[],()=>run().setOff(id,true,PIN),'İzinli Yap');
  else run().setOff(id,false,PIN);
}
function del(id){const s=D.staff.find(x=>x.id==id);ask(s.name+' silinsin mi?',[],()=>run().removeStaff(id,PIN),'Sil');}
function resetP(id){const s=D.staff.find(x=>x.id==id);ask(nice(s.name)+' için bugünkü tüm molalar sıfırlansın mı?',[],()=>run().resetStaff(id,PIN),'Sıfırla');}
function shiftUp(){
  ask('Haftalık Vardiya ('+BR[B]+')\nExcel veya Sheets tablosunu yapıştırın: her satırda personel adı, sonra Pzt-Paz vardiyası (08:00-16:00). Boş hücre = izinli.',
    [{label:'Vardiya tablosu',type:'textarea'}],v=>{
      if(!v[0].trim())return;
      google.script.run.withFailureHandler(e=>msg(emsg(e))).withSuccessHandler(r=>{
        msg('Vardiya yüklendi ✅\n'+r.ok+' kişi eşleşti'+(r.missing.length?'\n\nEşleşmeyen isimler:\n'+r.missing.join('\n'):'')+(r.absent.length?'\n\nListede olmadığı için bu hafta vardiya dışı sayılanlar:\n'+r.absent.join('\n'):''));
        load();
      }).uploadShift(B,v[0],PIN);
    },'Yükle');
}
function shiftClr(){ask(BR[B]+' vardiyaları temizlensin mi? Herkes yeniden görünür.',[],()=>google.script.run.withFailureHandler(e=>msg(emsg(e))).withSuccessHandler(()=>{msg('Vardiya temizlendi');load();}).clearShift(B,PIN),'Temizle');}
/* ===== Satış raporu görseli: ciro / hesap sayısı = ortalama ===== */
let RP=[],RPL=0;
const tl2=n=>Number(n).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=s=>{s=String(s||'').replace(/\s/g,'');if(!s)return NaN;return s.indexOf(',')>=0?Number(s.replace(/\./g,'').replace(',','.')):(/^\d{1,3}(\.\d{3})+$/.test(s)?Number(s.replace(/\./g,'')):Number(s));};
function rptLoad(){if(M!='y')return;google.script.run.withFailureHandler(()=>{}).withSuccessHandler(r=>{RP=r;rptDraw();}).listReports(PIN);}
function rptDraw(){
  const el=$('rpt');if(M!='y'){el.innerHTML='';return;}
  el.innerHTML=RP.length?'<div class="sec" style="margin:16px 2px 6px">📊 SATIŞ ORTALAMALARI (hesap başına)</div>'+RP.map((r,i)=>`<div class="card" style="min-height:0;align-items:stretch;text-align:left;margin-bottom:6px"><b>${i+1}. ${esc(nice(r.name))}</b><span class="sub">${esc(r.firma||'')} · ${esc(r.range||'')}</span><span>Ciro: <b>${tl2(r.ciro)} TL</b> · Hesap: <b>${r.hesap}</b></span><span style="color:#4ade80;font-weight:800;font-size:17px">Ortalama: ${tl2(r.ort)} TL</span><button class="a x" data-k="${esc(r.key)}" onclick="rptDel(this.dataset.k)">Sil</button></div>`).join(''):'';
}
function rptDel(k){ask('Bu kayıt silinsin mi?',[],()=>google.script.run.withFailureHandler(e=>msg(emsg(e))).withSuccessHandler(rptLoad).delReport(k,PIN),'Sil');}
function rptPick(){$('rf').value='';$('rf').click();}
function shrink(f){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const w=Math.min(1600,im.width),c=document.createElement('canvas');c.width=w;c.height=Math.round(im.height*w/im.width);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.9).split(',')[1]);};im.onerror=no;im.src=u;});}
$('rf').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;msg('Rapor okunuyor, birkaç saniye bekleyin…');
  try{const b=await shrink(f);google.script.run.withFailureHandler(er=>msg('Okunamadı:\n'+emsg(er))).withSuccessHandler(rptConfirm).readReport(b,PIN);}catch(er){msg('Görsel açılamadı.');}
});
function rptConfirm(r){
  const f=n=>(n===''||n==null)?'':tl2(n);
  ask((r.raw?'⚠ Bazı değerler okunamadı, elle tamamlayın.\n':'Okunan değerleri kontrol edin.\n')+(r.rep?'Rapordaki ortalama hesap tutarı: '+f(r.rep)+' TL\n':'')+(r.raw?'\nOkunan metin: '+r.raw:''),
    [{label:'Ad Soyad',val:nice(r.name)},{label:'Ciro (Ödemeler Toplamı)',val:f(r.ciro)},{label:'Hesap Sayısı',val:r.hesap===''?'':String(r.hesap)},{label:'Dönem',val:r.range},{label:'Firma',val:r.firma}],
    v=>{const d={name:v[0],ciro:num(v[1]),hesap:num(v[2]),range:v[3],firma:v[4]};
      google.script.run.withFailureHandler(e=>msg(emsg(e))).withSuccessHandler(o=>{msg(nice(d.name)+'\nCiro: '+tl2(d.ciro)+' TL\nHesap: '+d.hesap+'\nOrtalama: '+tl2(o.ort)+' TL');rptLoad();}).saveReport(d,PIN);},'Kaydet');
}
function reset(){ask('Bu şubenin tüm molaları sıfırlansın mı?',[],()=>run().resetDay(B,PIN),'Sıfırla');}
function tok(){
  ask('Ntfy Token',[{label:'ntfy.sh hesabınızdaki token (tk_ ile başlar)'}],v=>{
    if(!v[0].trim())return;
    google.script.run.withFailureHandler(e=>msg(emsg(e))).withSuccessHandler(()=>msg('Token kaydedildi ✅')).saveToken(v[0],PIN);},'Kaydet');
}
function code(id,name){
  google.script.run.withFailureHandler(e=>msg(emsg(e))).withSuccessHandler(t=>{
    msg(name+' için bildirim kodu:\n\n'+t+'\n\nntfy uygulamasında "+" ile bu kodu ekleyin.');}).getTopic(id,PIN);
}
function test(id){
  google.script.run.withFailureHandler(e=>msg('Gönderilemedi:\n'+emsg(e))).withSuccessHandler(()=>msg('Test gönderildi ✅')).sendTest(id,PIN);
}
function mailTest(){
  ask('Mail Testi',[{label:'Test maili gönderilecek e-posta (boşsa yönetici adresi)',type:'email'}],v=>{
    google.script.run.withFailureHandler(e=>msg('Mail gönderilemedi:\n'+emsg(e))).withSuccessHandler(a=>msg('Mail gönderildi ✅\n'+a)).sendMailTest(v[0],PIN);},'Gönder');
}
// Tarih tarih mola geçmişi
function hist(id){
  google.script.run.withFailureHandler(e=>msg(emsg(e))).withSuccessHandler(h=>{
    if(!h.rows.length)return msg(nice(h.name)+'\nHenüz kayıtlı mola yok.');
    const g={};h.rows.forEach(r=>{const d=new Date(r[0]).toLocaleDateString('tr-TR');(g[d]=g[d]||[]).push(r);});
    msg(nice(h.name)+'\n'+Object.keys(g).map(d=>'\n'+d+'  (toplam '+g[d].reduce((a,r)=>a+r[2],0)+' dk)\n'+g[d].map(r=>'  '+hm(r[0])+'–'+hm(r[3]||r[0]+r[2]*60000)+'  '+kn(r[1])+'  ('+r[2]+' dk)').join('\n')).join('\n'));
  }).getHistory(id,PIN);
}

/* ===== Sert sesli anons (yalnızca yönetici ekranında) ===== */
let REPEAT_MS=25000,MAX_REPEAT=6,VOICE=null,SPOKEN={};
function pickVoice(){
  if(!('speechSynthesis' in window))return;
  const vs=speechSynthesis.getVoices().filter(v=>/^tr/i.test(v.lang));
  VOICE=vs.find(v=>/tolga|cem|erkek|ahmet/i.test(v.name))||vs[0]||null;
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function nice(n){return String(n||'').toLocaleLowerCase('tr').replace(/(^|\s)\S/g,c=>c.toLocaleUpperCase('tr'));}
function speak(text){
  if(!('speechSynthesis' in window))return false;
  try{const u=new SpeechSynthesisUtterance(text);u.lang='tr-TR';if(VOICE)u.voice=VOICE;u.rate=1.1;u.pitch=0.55;u.volume=1;speechSynthesis.speak(u);return true;}catch(e){return false;}
}
function siren(){
  try{if(!ac)return;for(let i=0;i<3;i++){const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=i%2?700:1100;g.gain.value=.35;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+i*.2);o.stop(ac.currentTime+i*.2+.16);}}catch(e){}
}
function announce(s){siren();setTimeout(()=>speak(nice(s.name)+', molan bitti! Çabuk postana geç!'),650);}
function voiceTest(){perm(true);pickVoice();siren();setTimeout(()=>{if(!speak('Ahmet Polat, molan bitti! Çabuk postana geç!'))msg('Bu tarayıcı sesli okumayı desteklemiyor.');},650);}
document.addEventListener('click',()=>{if(window.__unlocked)return;window.__unlocked=1;try{speechSynthesis.speak(new SpeechSynthesisUtterance(''));}catch(e){}});

async function wake(on){
  try{
    if(on){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null;});return true;}
    if(WL){await WL.release();WL=null;}
  }catch(e){return false;}
  return false;
}
document.addEventListener('visibilitychange',()=>{if(ANONS&&document.visibilityState==='visible'&&!WL)wake(true);});
async function anons(){
  ANONS=!ANONS;
  if(ANONS){
    perm(true);pickVoice();MAX_REPEAT=40;
    const ok=await wake(true);head();
    siren();
    if(!ok)msg('Ekran otomatik açık tutulamadı.\nTelefonun Ayarlar > Ekran > Ekran zaman aşımı seçeneğini en uzun yapın ve şarjda bırakın.');
  }else{MAX_REPEAT=6;await wake(false);head();}
}

/* ===== Sayaç + yanıp sönme ===== */
function tick(){
  if(!D)return;
  const now=Date.now()+off;let late=false;
  document.querySelectorAll('.card[data-id]').forEach(el=>{
    const s=D.staff.find(x=>x.id==el.dataset.id),a=s&&s.active;
    if(!a)return;
    const r=endOf(a)-(a.paused?a.pausedAt:now),ab=Math.abs(r);
    const t=el.querySelector('.tm');if(t)t.textContent=(a.paused?'⏸ ':'')+(r<0?'+':'')+p(ab/60000|0)+':'+p(ab/1000%60|0);
    const lt=!a.paused&&r<0;
    el.classList.toggle('late',lt);el.classList.toggle('pz',!!a.paused);
    if(lt){
      late=true;
      const key=s.id+a.start+(a.pt||0);
      if(!alerted[key]){alerted[key]=1;alarm(s);}
      const sp=SPOKEN[key]||(SPOKEN[key]={n:0,t:0});
      if(M=='y'&&sp.n<MAX_REPEAT&&Date.now()-sp.t>REPEAT_MS){sp.n++;sp.t=Date.now();announce(s);}
      if(!a.notified&&(!chk[key]||Date.now()-chk[key]>20000)){chk[key]=Date.now();google.script.run.withFailureHandler(()=>{}).checkBreaks();}
    }
  });
  document.body.classList.toggle('alarm',late);
  if(!late)document.title='Mola Takip';
}
function perm(silent){
  try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}
  try{Notification.requestPermission();}catch(e){}
}
function alarm(s){
  document.title='🔴 MOLA DOLDU: '+s.name;
  try{navigator.vibrate&&navigator.vibrate([800,300,800,300,800,300,800]);}catch(e){}
  try{if(Notification.permission=='granted')new Notification('⏰ Mola doldu',{body:s.name+', molan bitti! Çabuk postana geç.',requireInteraction:true,vibrate:[800,300,800]});}catch(e){}
}

load();
setInterval(tick,1000);
setInterval(()=>{if($('ov').hidden)load();},5000);
</script>
