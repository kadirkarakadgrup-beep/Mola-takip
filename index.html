<title>Happy Moon's İzmir Şubeler</title>
<script defer src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:radial-gradient(120% 60% at 50% 0,#3b1020 0,#0f172a 58%) fixed;color:#f1f5f9;padding:14px;padding-top:max(14px,env(safe-area-inset-top));min-height:100vh}
.hd{display:flex;align-items:center;gap:14px;padding:12px 16px;margin-bottom:14px;border-radius:20px;background:linear-gradient(135deg,#991b1b,#7f1d1d 60%,#450a0a);border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 28px rgba(0,0,0,.4)}
.lg{flex:none;height:70px;width:70px;object-fit:cover;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.35)}.vt{position:absolute;right:10px;bottom:12px;font-size:9px;opacity:.45;color:#fff}
.hn{font-size:21px;font-weight:800;color:#fff;line-height:1.1}.hs{font-size:11px;font-weight:700;color:#fde68a;letter-spacing:.18em;text-transform:uppercase;margin-top:4px}
.top{display:flex;gap:8px;margin-bottom:10px;background:#172033;padding:4px;border-radius:16px;border:1px solid rgba(148,163,184,.12)}
.tab{flex:1;padding:12px;border:0;border-radius:12px;background:transparent;color:#94a3b8;font-size:15px;font-weight:600}
.tab.on{background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff;box-shadow:0 4px 12px rgba(220,38,38,.4)}
.tab.m.on{background:linear-gradient(135deg,#8b5cf6,#6d28d9)}
#st{font-size:13px;color:#fbbf24;margin:0 0 8px}
#an{display:none;background:#4c1d95;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:700;margin-bottom:10px}
.dt{display:inline-block;font-size:13px;color:#cbd5e1;font-weight:700;background:rgba(148,163,184,.12);padding:6px 12px;border-radius:20px;margin:0 0 10px}
.sec{grid-column:1/-1;font-size:12px;font-weight:700;letter-spacing:.08em;color:#94a3b8;margin:6px 2px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.grid.one{grid-template-columns:1fr}.grid.one .card{min-height:200px}.grid.one .tm{font-size:54px}.grid.one .nm{font-size:22px}
.card{background:linear-gradient(160deg,#1f2b42,#162033);border:2px solid rgba(148,163,184,.12);border-radius:18px;box-shadow:0 6px 16px rgba(0,0,0,.28);padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:6px;min-height:165px;text-align:center}
.card.offc{opacity:.55}.card.on{border-color:#22c55e}.card.pz{border-color:#eab308}.card.turn{border-color:#facc15;box-shadow:0 0 0 2px #facc1566}
.sr{display:inline-block;background:#334155;border-radius:50%;width:22px;height:22px;line-height:22px;font-size:12px;margin-right:5px}
.nm{font-weight:800;font-size:17px;line-height:1.15;word-break:break-word}.sub{font-size:12px;color:#94a3b8}
.tm{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;color:#4ade80;line-height:1}
.card.pz .tm{color:#facc15}.card.late{border-color:#ef4444;animation:blink .8s infinite}.card.late .tm{color:#fff}
.lt{display:none;font-weight:800;font-size:13px}.card.late .lt{display:block}
@keyframes blink{0%,100%{background:#dc2626}50%{background:#450a0e}}
body.alarm{animation:bg .8s infinite}@keyframes bg{0%,100%{background:#0f172a}50%{background:#5b0b0b}}
button.a,a.a{border:0;border-radius:12px;padding:12px 14px;font-weight:700;font-size:14px;color:#fff;background:#16a34a;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 3px 8px rgba(0,0,0,.3)}
button.a:active,a.a:active{transform:scale(.97)}a.a{display:block;text-align:center;text-decoration:none}a.a.wa{background:#128c7e}
.btns .k-yemek{background:#2563eb}.btns .k-kahvalti,.btns .k-aksam{background:#9333ea}
button.a.end{background:#dc2626}button.a.x{background:#475569;padding:10px 12px}button.a.off{background:#b45309}button.a.ed{background:#0e7490;padding:10px 12px}button.a.an{background:#7c3aed}
.btns{display:flex;flex-direction:column;gap:6px;width:100%}.btns button,.btns a{width:100%}
.btns button small{display:block;font-size:12px;opacity:.9}.fin{font-weight:800;color:#4ade80;padding:10px 0}
.ib{display:flex;flex-wrap:wrap;gap:4px;width:100%}.ib button{flex:1 1 34px;padding:8px 0;font-size:16px;border:0;border-radius:10px;color:#fff;background:#475569}
.ib .ed{background:#0e7490}.ib .off,.ib .rs{background:#b45309}
.bar{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}.bar button{flex:1 1 140px}
details.tl{width:100%;background:#1e293b;border-radius:14px;padding:10px}details.tl summary{font-weight:700;cursor:pointer;color:#cbd5e1}
.legend{font-size:11px;color:#94a3b8;margin:0 2px 8px}
.chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.chip{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;background:#166534;color:#bbf7d0}
.chip.cur{background:transparent;border:2px solid #facc15;color:#facc15;padding:0 6px}.chip.left{background:#334155;color:#e2e8f0}.chip.offb{background:#b45309;color:#fff}
.chip.errc{background:#fff;color:#b91c1c}.chip.okc{background:#fff;color:#166534}
.err{background:#7f1d1d;padding:12px;border-radius:10px;font-size:14px}

.mb h3{margin:0 0 12px;font-size:17px;word-break:break-word;white-space:pre-line}.mb label{display:block;font-size:13px;color:#94a3b8;margin:10px 0 4px}
.mb input,.mb textarea,.mb select{font-family:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid #475569;background:#0f172a;color:#fff;font-size:16px}
.mbt{display:flex;gap:8px;margin-top:16px}.mbt button{flex:1}
.xl{border-collapse:collapse;font-size:12px;min-width:680px;width:100%;color:#000;background:#fff}

.xl .nmc{position:sticky;left:0;background:#fff;text-align:left;font-weight:800;padding:6px}.xl th{background:#fff;font-size:11px}.xl .dn{color:#1d4ed8;text-decoration:underline}
.xl2{min-width:0!important}.xl2 th,.xl2 td{white-space:normal!important}.xl2 th{background:#217346;color:#fff}.xl2 .l{text-align:left}.xl2 td.r{text-align:right}.xl2 td.g{color:#166534;font-weight:800}
.xl2 tr:nth-child(even) td{background:#f1f5f9}.xl2 tr.tot td{background:#e2e8f0;font-weight:800}

function ask(title,fields,cb,okText){
  $('ov').querySelector('.mb').style.maxWidth='';$('mt').textContent=title;
  $('mf').innerHTML=fields.map((f,i)=>f.type=='textarea'?`<label>${f.label}</label><textarea id="f${i}" rows="9">${esc(f.val)}</textarea>`:f.type=='select'?`<label>${f.label}</label><select id="f${i}">${f.opts.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('')}</select>`:`<label>${f.label}</label><input id="f${i}" type="${f.type||'text'}" value="${esc(f.val)}" autocomplete="off" ${f.type=='password'?'inputmode="numeric"':''}>`).join('');
  $('mo').textContent=okText||'Tamam';$('mc').style.display='';$('ov').hidden=false;
  $('mc').onclick=()=>$('ov').hidden=true;
  $('mo').onclick=()=>{const v=fields.map((f,i)=>$('f'+i).value);$('ov').hidden=true;cb(v);};
  const f0=$('f0');
  if(f0&&f0.tagName!='SELECT'){f0.focus();setTimeout(()=>{f0.focus();},60);}
  fields.forEach((f,i)=>{const e=$('f'+i);if(e&&e.tagName=='INPUT')e.onkeydown=ev=>{if(ev.key=='Enter'){ev.preventDefault();if(i<fields.length-1&&$('f'+(i+1))&&$('f'+(i+1)).tagName=='INPUT')$('f'+(i+1)).focus();else $('mo').click();}};});
}
function msg(t){ask(t,[],()=>{},'Tamam');$('mc').style.display='none';}
function pop(t,h,wide){msg(t);$('mf').innerHTML=h;if(wide)$('ov').querySelector('.mb').style.maxWidth='96vw';}

function load(){
  google.script.run.withFailureHandler(e=>{const m=emsg(e);if(D)$('st').textContent='⚠ '+m+' - yeniden deneniyor…';else{head();$('list').innerHTML='<div class="err">Hata: '+esc(m)+'</div>';}clearTimeout(retry);retry=setTimeout(load,3000);})
  .withSuccessHandler(d=>{$('st').textContent='';if(!d||!d.names){head();$('list').innerHTML='<div class="err">Sunucu yanıtı geçersiz.</div>';return;}D=d;off=d.now-Date.now();try{draw();}catch(e){$('list').innerHTML='<div class="err">Çizim hatası: '+esc(emsg(e))+'</div>';}}).getState(B,M=='y'?PIN:'');
}
function head(){
  $('br').innerHTML=Object.keys(BR).map(k=>`<button class="tab ${k==B?'on':''}" onclick="B='${k}';lset('br',B);RPL=0;RP=[];BP=[];load()">${BR[k]}</button>`).join('');
  $('md').innerHTML=`<button class="tab ${M=='g'?'on':''}" onclick="setM('g')">👤 Personel</button><button class="tab m ${M=='y'?'on':''}" onclick="setM('y')">🔑 Yönetici</button>`;
  $('tools').innerHTML=M=='y'
  ?`<button class="a" onclick="add()">+ Personel Ekle</button><button class="a x" onclick="reset()">Günü Sıfırla</button><button class="a ed" onclick="shiftPick()">📷 Vardiya Görseli</button><button class="a ed" onclick="shiftUp()">📅 Vardiya Yükle</button><button class="a ed" onclick="rptPick()">📷 Satış Raporu Yükle</button><button class="a ed" onclick="rptManual()">✍ Elle Ciro</button><button class="a ed" onclick="beerPick()">🍺 Bira Satışı Yükle</button><button class="a ed" onclick="shiftShow()">🕗 Vardiya Tablosu</button><button class="a an" onclick="anons()">${ANONS?'📢 Anons: AÇIK (kapat)':'📢 Anons Modu'}</button>
  <details class="tl" ${TO?'open':''} ontoggle="TO=this.open"><summary>⚙ Araçlar</summary><div class="bar"><button class="a ed" onclick="code('yonetici','Yönetici')">📲 Yönetici Kodu</button><button class="a off" onclick="test('yonetici')">🔔 Test Bildirimi</button><button class="a ed" onclick="tok()">🔑 Ntfy Token</button><button class="a ed" onclick="voiceTest()">🔊 Anons Testi</button><button class="a off" onclick="shiftClr()">🗑 Vardiyayı Temizle</button></div></details>`
  :`<button class="a ed" onclick="rptShow()">📊 Ciro Ortalamam</button><button class="a ed" onclick="shiftShow()">🕗 Vardiyam</button><button class="a ed" onclick="beerShow()">🍺 Bira Satışım</button><button class="a ed" onclick="myCode()">🔔 Bildirim Kodum</button>`;
  $('an').style.display=(ANONS&&M=='y')?'block':'none';$('an').textContent='📢 Anons açık: ekran açık ve şarjda kalmalı.';
}
function setM(m){
  if(m=='y'&&!PIN)ask('Yönetici şifresi',[{label:'Şifre',type:'password'}],v=>{google.script.run.withFailureHandler(e=>msg(emsg(e))).withSuccessHandler(ok=>{if(ok){google.script.run.withFailureHandler(()=>{PIN=v[0];M='y';load();}).withSuccessHandler(i=>{window.__ADM=i;PIN=v[0];M='y';load();}).adminInfo(v[0]);}else msg('Şifre yanlış');}).checkPin(v[0]);},'Giriş');
  else{M=m;load();}
}
/* Garson: yalnızca kendi adı */
function pickMe(){
  const L=D.staff.slice().sort((a,b)=>a.name.localeCompare(b.name,'tr'));
  ask('Adını seç · '+BR[B],[{label:'Personel',type:'select',opts:L.map(s=>[s.id,nice(s.name)])}],v=>{lset('me_'+B,v[0]);draw();},'Bu benim');
}
function regMe(){ask('Kayıt Ol · '+BR[B],[{label:'Ad Soyad'},{label:'Telefon (isteğe bağlı)',type:'tel'},{label:'E-posta (isteğe bağlı)'}],v=>{if(!v[0].trim())return;google.script.run.withFailureHandler(e=>msg(emsg(e))).withSuccessHandler(n=>{msg('Kaydın oluşturuldu ✅');setTimeout(()=>{load();},400);}).selfRegister(B,v[0],v[1],v[2]);},'Kaydol');}
function myCode(){const m=me();if(!m){msg('Önce adını seç.');return;}google.script.run.withFailureHandler(e=>msg('Kod alınamadı. Yöneticiden 📲 ile kodunu isteyin.')).withSuccessHandler(t=>msg('Bildirim kodun:\n\n'+t+'\n\nntfy uygulamasında "+" ile bu kodu ekle; molan bitince bildirim sadece sana düşer.')).getTopic(m.id,'');}

function tile(s){
  const left=Math.max(0,D.total-usedOf(s)),a=s.active;
  let chips=(s.done||[]).map(x=>typeof x==='object'?`<span class="chip">✓ ${esc(kn(x.k))} ${hm(x.t)}–${hm(x.e||x.t+x.m*60000)} (${x.m} dk)</span>`:`<span class="chip">✓ ${x} dk</span>`).join('');

function cv(f,flt){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const w=Math.max(1800,im.width),c=document.createElement('canvas');c.width=w;c.height=Math.round(im.height*w/im.width);const x=c.getContext('2d',{willReadFrequently:true});if(flt){try{x.filter='grayscale(1) contrast(1.3)';}catch(e){}}x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c);};im.onerror=no;im.src=u;});}
const rec=async(c,l)=>Tesseract.recognize(c,'tur',{logger:m=>{if(m.status)$('st').textContent=l+' '+(m.progress?'%'+Math.round(m.progress*100):'');}});
const words=r=>(r.data.words||[]).filter(w=>w&&w.text&&w.text.trim()&&w.bbox).map(w=>({t:w.text.trim(),x0:w.bbox.x0,x:(w.bbox.x0+w.bbox.x1)/2,y:(w.bbox.y0+w.bbox.y1)/2,h:w.bbox.y1-w.bbox.y0}));

const MONEY='(\\d{1,3}(?:\\.\\d{3})*,\\d{2})';
function parseRep(t){
  const g=re=>{const m=t.match(re);return m?m[1].trim():'';};
  let name=g(/Ad[ıiIl1]\s*:\s*[\w\-]*\s*[\/|\\]\s*([^\n\r]+)/i);const firma=g(/Firma\s+Ad[ıiI]\s*:\s*([^\n\r]+)/i),range=g(/Tarih\s+Aral\S{2,4}\s*:\s*([\d.]+\s*-\s*[\d.]+)/i);
  const pairs=[],re=new RegExp('[ÖO0]demeler\\s+Toplam\\S{0,3}\\s*:?\\s*(\\d[\\d.]*)\\D{0,4}?\\s*'+MONEY,'gi');let m;
  while((m=re.exec(t)))pairs.push({c:num(m[1]),a:num(m[2])});
  let hesap=num(g(/Hesap\s+Say\S{0,5}\s*:?\s*(\d[\d.]*)/i));if(!(hesap>0)&&pairs.length)hesap=pairs[pairs.length-1].c;
  const pr=pairs.find(x=>x.c!=hesap)||pairs[0];let ciro=pr?pr.a:NaN;if(!(ciro>0))ciro=num(g(new RegExp('Toplam\\s+Sat\\S{0,4}\\s*[_:]*\\s*'+MONEY,'i')));
  const st=(D&&D.staff)||[],hit=st.find(x=>name&&nrm(name)==nrm(x.name))||st.find(x=>nrm(t).includes(nrm(x.name)));if(hit)name=hit.name;
  return{name:name,firma:firma,range:range,hesap:hesap>0?hesap:'',ciro:ciro>0?ciro:''};
}

      if(id){cur={name:t.filter(w=>w.x0>id.x0&&(!code||w.x0<code.x0)&&alpha.test(w.t)).map(w=>w.t).join(' ')||null,wheel:0};}
      if(code){if(!cur)cur={name:null,wheel:0};if(q&&a&&num(a.t)===0)cur.wheel+=num(q.t);}

/* ===== Vardiya görselinden okuma ===== */
const DNM=['pazartesi','sali','carsamba','persembe','cuma','cumartesi','pazar'];
