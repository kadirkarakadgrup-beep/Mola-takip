<!DOCTYPE html>
<html lang="tr"><head><base target="_top"><meta charset="utf-8">
<meta name="theme-color" content="#1e1b4b">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mola Takip</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:radial-gradient(120% 60% at 50% 0,#27235f 0,#0f172a 55%) fixed;color:#f1f5f9;padding:14px;min-height:100vh}
.hd{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:14px;border-radius:20px;background:linear-gradient(135deg,#1e3a8a,#4c1d95);border:1px solid rgba(255,255,255,.1);box-shadow:0 10px 28px rgba(0,0,0,.4)}
.lg{flex:none;height:62px;background:#fff;border-radius:14px;padding:4px 8px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.hn{font-size:20px;font-weight:800;color:#fff;line-height:1.15}
.hs{font-size:11px;font-weight:700;color:#fde68a;letter-spacing:.18em;text-transform:uppercase;margin-top:3px}
.top{display:flex;gap:8px;margin-bottom:10px;background:#172033;padding:4px;border-radius:16px;border:1px solid rgba(148,163,184,.12)}
.tab{flex:1;padding:12px;border:0;border-radius:12px;background:transparent;color:#94a3b8;font-size:15px;font-weight:600;transition:background .15s,color .15s}
.tab.on{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.45)}
.tab.m.on{background:linear-gradient(135deg,#8b5cf6,#6d28d9);box-shadow:0 4px 12px rgba(124,58,237,.45)}
#st{font-size:13px;color:#fbbf24;margin:0 0 8px}
#an{display:none;background:#4c1d95;color:#fff;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:700;margin-bottom:10px}
.dt{display:inline-block;font-size:13px;color:#cbd5e1;font-weight:700;background:rgba(148,163,184,.12);padding:6px 12px;border-radius:20px;margin:0 0 10px}
.sec{grid-column:1/-1;font-size:12px;font-weight:700;letter-spacing:.08em;color:#94a3b8;margin:6px 2px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{background:linear-gradient(160deg,#1f2b42,#162033);border:2px solid rgba(148,163,184,.12);border-radius:18px;box-shadow:0 6px 16px rgba(0,0,0,.28);padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:6px;min-height:165px;text-align:center}
.card.offc{opacity:.55}.card.on{border-color:#22c55e}.card.pz{border-color:#eab308}.card.turn{border-color:#facc15;box-shadow:0 0 0 2px #facc1566}
.sr{display:inline-block;background:#334155;border-radius:50%;width:22px;height:22px;line-height:22px;font-size:12px;margin-right:5px;vertical-align:middle}
.nm{font-weight:800;font-size:17px;line-height:1.15;word-break:break-word}
.sub{font-size:12px;color:#94a3b8}
.tm{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;color:#4ade80;line-height:1;text-shadow:0 0 18px rgba(74,222,128,.45)}
.card.pz .tm{color:#facc15}
.card.late{border-color:#ef4444;animation:blink .8s infinite}.card.late .tm{color:#fff}
.lt{display:none;font-weight:800;font-size:13px;color:#fff}.card.late .lt{display:block}
@keyframes blink{0%,100%{background:#dc2626}50%{background:#450a0e}}
body.alarm{animation:bg .8s infinite}
@keyframes bg{0%,100%{background:#0f172a}50%{background:#5b0b0b}}
button.a,a.a{border:0;border-radius:12px;padding:12px 14px;font-weight:700;font-size:14px;color:#fff;background:#16a34a;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 3px 8px rgba(0,0,0,.3);transition:transform .1s,filter .1s}
button.a:active,a.a:active{transform:scale(.97);filter:brightness(.92)}
a.a{display:block;text-align:center;text-decoration:none}a.a.wa{background:#128c7e}
.btns .k-yemek{background:#2563eb}.btns .k-kahvalti,.btns .k-aksam{background:#9333ea}
button.a.end{background:#dc2626}button.a.x{background:#475569;padding:10px 12px}
button.a.off{background:#b45309}button.a.ed{background:#0e7490;padding:10px 12px}button.a.an{background:#7c3aed}
.btns{display:flex;flex-direction:column;gap:6px;width:100%}.btns button,.btns a{width:100%}
.btns button small{display:block;font-size:12px;font-weight:600;opacity:.9;margin-top:2px}.fin{font-weight:800;color:#4ade80;padding:10px 0}
.ib{display:flex;flex-wrap:wrap;gap:4px;width:100%}
.ib button{flex:1 1 34px;padding:8px 0;font-size:16px;border:0;border-radius:10px;color:#fff;background:#475569}
.ib .ed{background:#0e7490}.ib .off,.ib .rs{background:#b45309}
.bar{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}.bar button{flex:1}
details.tl{margin:0 0 10px;background:#1e293b;border-radius:14px;padding:10px;border:1px solid rgba(148,163,184,.12)}
details.tl summary{font-weight:700;cursor:pointer;color:#cbd5e1}details.tl .bar{margin:10px 0 0}
.legend{font-size:11px;color:#94a3b8;margin:0 2px 8px}
.chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.chip{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;background:#166534;color:#bbf7d0}
.chip.cur{background:transparent;border:2px solid #facc15;color:#facc15;padding:0 6px}
.chip.left{background:#334155;color:#e2e8f0}.chip.offb{background:#b45309;color:#fff}
.chip.errc{background:#fff;color:#b91c1c}.chip.okc{background:#fff;color:#166534}
.err{background:#7f1d1d;padding:12px;border-radius:10px;font-size:14px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9;backdrop-filter:blur(4px)}.ov[hidden]{display:none}
.mb{background:#1e293b;border-radius:22px;padding:20px;width:100%;max-width:380px;max-height:90vh;overflow:auto;border:1px solid rgba(148,163,184,.15);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.mb h3{margin:0 0 12px;font-size:17px;word-break:break-word;white-space:pre-line}
.mb label{display:block;font-size:13px;color:#94a3b8;margin:10px 0 4px}
.mb input,.mb textarea{font-family:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid #475569;background:#0f172a;color:#fff;font-size:16px}
.mbt{display:flex;gap:8px;margin-top:16px}.mbt button{flex:1}
/* Excel tarzı vardiya tablosu */
.xl{border-collapse:collapse;font-size:12px;min-width:680px;width:100%;color:#000;background:#fff}
.xl th,.xl td{border:1px solid #000;padding:5px 4px;text-align:center;white-space:nowrap}
.xl .nmc{position:sticky;left:0;background:#fff;text-align:left;font-weight:800;padding:6px;z-index:1}
.xl th{background:#fff;font-size:11px}.xl .dn{color:#1d4ed8;text-decoration:underline}
.xl2 th{background:#217346;color:#fff}.xl2 .l{text-align:left}.xl2 td.r{text-align:right}.xl2 td.g{color:#166534;font-weight:800}
.xl2 tr:nth-child(even) td{background:#f1f5f9}.xl2 tr.tot td{background:#e2e8f0;font-weight:800}
.xl .td{background:#bbf7d0!important}
.xl td.c{font-weight:700;font-size:12px}.xl td.c small{display:block;font-weight:700;font-size:11px;text-decoration:underline}
.xl td.tdy{outline:3px solid #16a34a;outline-offset:-3px}
</style></head>

<div class="top" id="br"></div><div class="top" id="md"></div><div id="an"></div>
<div class="bar" id="tools"></div><div id="st"></div><div id="sum"></div><div id="list"></div><div id="rpt"></div><input type="file" id="rf" accept="image/*" hidden>
<div class="ov" id="ov" hidden><div class="mb"><h3 id="mt"></h3><div id="mf"></div>
<div class="mbt"><button class="a x" id="mc">İptal</button><button class="a" id="mo">Tamam</button></div></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
let B='opt',M='g',PIN='',D=null,off=0,alerted={},chk={},ac=null,TO=false,retry=null,ANONS=false,WL=null,RP=[],RPL=0;
const BR={mavi:'Mavi Bahçe',opt:'Optimum'};
const $=id=>document.getElementById(id);
const p=n=>String(n).padStart(2,'0');
const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const hm=t=>new Date(t).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
const emsg=e=>(e&&e.message)?e.message:'Bağlantı sorunu';
const run=()=>google.script.run.withFailureHandler(e=>msg(emsg(e))).withSuccessHandler(load);
const dm=x=>Number(x&&typeof x==='object'?x.m:x)||0;
const usedOf=s=>(s.done||[]).filter(x=>x&&typeof x==='object'&&(x.k==='mola'||x.k==='yemek')).reduce((a,x)=>a+dm(x),0);
const endOf=a=>a.start+(a.pt||0)+a.dur*60000;
const kn=k=>D.names[k]||k||'';
const tl2=n=>Number(n).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=s=>{s=String(s||'').replace(/\s/g,'');if(!s)return NaN;return s.indexOf(',')>=0?Number(s.replace(/\./g,'').replace(',','.')):(/^\d{1,3}(\.\d{3})+$/.test(s)?Number(s.replace(/\./g,'')):Number(s));};
const nrm=s=>String(s||'').replace(/İ/g,'i').replace(/I/g,'i').toLowerCase().replace(/ı/g,'i').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ş/g,'s').replace(/ö/g,'o').replace(/ç/g,'c').replace(/[^a-z0-9]/g,'');
function nice(n){return String(n||'').toLocaleLowerCase('tr').replace(/(^|\s)\S/g,c=>c.toLocaleUpperCase('tr'));}

function ask(title,fields,cb,okText){
  $('ov').querySelector('.mb').style.maxWidth='';
  $('mt').textContent=title;
  $('mf').innerHTML=fields.map((f,i)=>f.type=='textarea'?`<label>${f.label}</label><textarea id="f${i}" rows="9" placeholder="Excel'den kopyalayıp yapıştırın">${esc(f.val)}</textarea>`:`<label>${f.label}</label><input id="f${i}" type="${f.type||'text'}" value="${esc(f.val)}" autocomplete="off" ${f.type=='password'?'inputmode="numeric"':''}>`).join('');
  $('mo').textContent=okText||'Tamam';$('mc').textContent='İptal';$('mc').style.display='';$('ov').hidden=false;
  if(fields.length)setTimeout(()=>$('f0').focus(),50);
  $('mc').onclick=()=>$('ov').hidden=true;
  $('mo').onclick=()=>{const v=fields.map((f,i)=>$('f'+i).value);$('ov').hidden=true;cb(v);};
}
function msg(t){ask(t,[],()=>{},'Tamam');$('mc').style.display='none';}
function pop(t,h,wide){msg(t);$('mf').innerHTML=h;if(wide)$('ov').querySelector('.mb').style.maxWidth='96vw';}

function load(){
  google.script.run
    .withFailureHandler(e=>{
      const m=emsg(e);
      if(D)$('st').textContent='⚠ '+m+' - yeniden deneniyor…';
      else{head();$('list').innerHTML='<div class="err">Hata: '+esc(m)+'<br>Yeniden deneniyor…</div>';}
      clearTimeout(retry);retry=setTimeout(load,3000);
    })
    .withSuccessHandler(d=>{
      $('st').textContent='';
      if(!d||!d.names){head();$('list').innerHTML='<div class="err">Sunucu yanıtı geçersiz.</div>';return;}
      D=d;off=d.now-Date.now();
      try{draw();}catch(e){$('list').innerHTML='<div class="err">Çizim hatası: '+esc(emsg(e))+'</div>';}
    }).getState(B,M=='y'?PIN:'');
}

function head(){
  $('br').innerHTML=Object.keys(BR).map(k=>`<button class="tab ${k==B?'on':''}" onclick="B='${k}';RPL=0;RP=[];load()">${BR[k]}</button>`).join('');
  $('md').innerHTML=`<button class="tab ${M=='g'?'on':''}" onclick="setM('g')">👤 Garson</button><button class="tab m ${M=='y'?'on':''}" onclick="setM('y')">🔑 Yönetici</button>`;
  $('tools').innerHTML=M=='y'
    ?`<button class="a" onclick="add()">+ Personel Ekle</button><button class="a x" onclick="reset()">Günü Sıfırla</button><button class="a ed" onclick="shiftUp()">📅 Vardiya Yükle</button><button class="a ed" onclick="shiftPick()">📷 Vardiya Görseli</button><button class="a ed" onclick="rptPick()">📷 Satış Raporu Yükle</button><button class="a ed" onclick="rptManual()">✍ Elle Ciro</button><button class="a ed" onclick="shiftShow()">🕗 Vardiya Tablosu</button>
      <button class="a an" onclick="anons()">${ANONS?'📢 Anons Modu: AÇIK (kapat)':'📢 Anons Modu'}</button>
      <details class="tl" style="width:100%" ${TO?'open':''} ontoggle="TO=this.open"><summary>⚙ Araçlar</summary><div class="bar">
        <button class="a ed" onclick="code('yonetici','Yönetici')">📲 Yönetici Kodu</button>
        <button class="a off" onclick="test('yonetici')">🔔 Test Bildirimi</button>
        <button class="a ed" onclick="tok()">🔑 Ntfy Token</button>
        <button class="a ed" onclick="voiceTest()">🔊 Anons Testi</button><button class="a off" onclick="shiftClr()">🗑 Vardiyayı Temizle</button></div></details>`
    :`<button class="a ed" onclick="rptShow()">📊 Ciro Ortalama</button><button class="a ed" onclick="shiftShow()">🕗 Vardiya</button><button class="a" style="flex-basis:100%" onclick="regMe()">➕ Kayıt Ol (personel listesine ekle)</button>`;
  $('an').style.display=(ANONS&&M=='y')?'block':'none';
  $('an').textContent='📢 Anons modu açık: bu cihazın ekranı açık ve şarjda kalmalı. Molası dolan kişiye sesli seslenilir.';
}
function setM(m){
  if(m=='y'&&!PIN){
    ask('Yönetici şifresi',[{label:'Şifre',type:'password'}],v=>{
      google.script.run.withFailureHandler(e=>msg(emsg(e))).withSuccessHandler(ok=>{if(ok){PIN=v[0];M='y';load();}else msg('Şifre yanlış');}).checkPin(v[0]);
    },'Giriş');
  }else{M=m;load();}
}

function tile(s){
  const left=Math.max(0,D.total-usedOf(s)),a=s.active;
  let chips=(s.done||[]).map(x=>typeof x==='object'?`<span class="chip">✓ ${esc(kn(x.k))} ${hm(x.t)}–${hm(x.e||x.t+x.m*60000)} (${x.m} dk)</span>`:`<span class="chip">✓ ${x} dk</span>`).join('');
  if(a)chips+=`<span class="chip cur">${esc(a.n)} ${a.dur} dk${a.paused?' · ⏸ duraklatıldı':''}</span><span class="chip cur">${hm(a.start)} çıktı${a.paused?'':' · '+hm(endOf(a))+' dönüş'}</span>`;
  chips+=`<span class="chip left">Kalan ${left} dk</span>`;
  if(s.shTxt)chips+=`<span class="chip left">🕗 ${s.shTxt.replace('-','–')}</span>`;
  if(s.turn&&!a)chips+='<span class="chip cur">⏭ SIRADAKİ</span>';
  if(M=='y'&&a){
    if(a.sent)chips+=`<span class="chip okc">🔔 gitti ${hm(a.sent)}</span>`;
    else if(a.sched)chips+=`<span class="chip okc">🔔 ${hm(endOf(a))}'de</span>`;
    else if(a.err)chips+=`<span class="chip errc" onclick="showErr('${s.id}','err')">⚠ bildirim</span>`;
  }
  if(s.off)chips=`<span class="chip offb">İZİNLİ</span>`;
  let btns='';
  if(M=='g'&&!a&&!s.off){
    btns=!(s.opts||[]).length?(s.bitti?'<div class="fin">✅ Molalar bitti</div>':'<span class="sub">Şu an mola saati değil</span>')
      :'<div class="btns">'+s.opts.map(o=>`<button class="a k-${o.k}" onclick="startB('${s.id}','${o.k}')"><b>${esc(o.n)}</b><small>${o.d} dk${o.d<o.full?' (devam)':''}</small></button>`).join('')+'</div>';
  }
  if(M=='g'&&a)btns=`<div class="btns"><button class="a end" onclick="endBG('${s.id}')">Molayı Bitir</button></div>`;
  if(M=='y'){
    if(a){
      if(s.phone){
        const n=String(s.phone).replace(/[^\d+]/g,''),wa=n.replace('+',''),txt=encodeURIComponent(nice(s.name)+', molan bitti. Çabuk postana geç!');
        btns+=`<div class="btns"><a class="a" href="tel:${n}" target="_top">📞 Ara</a><a class="a wa" href="https://wa.me/${wa}?text=${txt}" target="_blank" rel="noopener">💬 WhatsApp</a></div>`;
      }else btns+='<div class="sub">📵 Telefon yok (✏️ ile ekleyin)</div>';
      btns+=`<div class="btns"><button class="a off" onclick="${a.paused?'resumeB':'pauseB'}('${s.id}')">${a.paused?'▶ Devam':'⏸ Durdur'}</button><button class="a end" onclick="endB('${s.id}')">Molayı Bitir</button></div>`;
    }
    btns+=`<div class="ib"><button class="ed" title="Düzenle" onclick="edit('${s.id}')">✏️</button>`+
      `<button class="off" title="İzinli" onclick="toggleOff('${s.id}',${s.off?'false':'true'})">${s.off?'✅':'🚫'}</button>`+
      `<button title="Kod" onclick="code('${s.id}','${esc(s.name).replace(/'/g,'')}')">📲</button>`+
      `<button title="Geçmiş" onclick="hist('${s.id}')">📅</button>`+
      `<button title="Molasını sıfırla" onclick="resetP('${s.id}')">♻️</button>`+
      (a?`<button class="rs" title="Tekrar gönder" onclick="resend('${s.id}')">🔔</button>`:'')+
      `<button title="Sil" onclick="del('${s.id}')">🗑</button></div>`;
  }
  return `<div class="card ${a?'on':''} ${s.off||(s.on===false&&!a)?'offc':''} ${s.turn&&!a?'turn':''}" data-id="${s.id}">
    <div class="nm">${s.sira&&s.on!==false?'<span class="sr">'+s.sira+'</span>':''}${esc(s.name)}</div>${a?'<div class="tm">--:--</div>':''}
    <div class="chips">${chips}</div><div class="lt">⚠ MOLAN BİTTİ!</div>${btns}</div>`;
}

function draw(){
  head();
  const S=D.staff.filter(s=>M=='y'||(!s.off&&(s.on!==false||s.active)));
  const act=S.filter(s=>s.active).sort((a,b)=>a.active.start-b.active.start);
  const rest=S.filter(s=>!s.active&&!s.off&&s.on!==false).sort((a,b)=>(a.sira||999)-(b.sira||999)||a.name.localeCompare(b.name,'tr'));

/* ===== Vardiya görselinden okuma: başlık sütunları + hücre rengi + OCR ===== */
const DNM=['pazartesi','sali','carsamba','persembe','cuma','cumartesi','pazar'];
const SHP=[[255,0,0,0],[255,255,0,8],[255,192,0,10],[0,255,255,12],[146,208,80,14],[0,176,80,16]];
function hourOfRGB(r,g,b){let best=null,bd=1e9;SHP.forEach(c=>{const d=(r-c[0])**2+(g-c[1])**2+(b-c[2])**2;if(d<bd){bd=d;best=c;}});return bd<9000?best[3]:-1;}
const lev=(a,b)=>{const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let q=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,q+(a[i-1]==b[j-1]?0:1));q=t;}}return d[b.length];};
// W: OCR kelimeleri, col(x,y): hücre rengine göre saat (0=kırmızı/izin, -1=bilinmiyor), st: personel
function gridShift(W,col,st){
  const tmr=/^(\d{1,2})[.,:](\d{2})$/,T=[],N=[];
  W.forEach(w=>{const c=w.t.replace(/[^\d.,:]/g,''),m=tmr.exec(c);if(m&&c.length>=4&&+m[1]<=24)T.push(Object.assign({},w,{hh:+m[1],mm:m[2]}));else N.push(w);});
  if(!T.length)return null;
  const cx=DNM.map(n=>{const c=N.filter(w=>nrm(w.t)==n).sort((a,b)=>a.y-b.y)[0];return c?c.x:null;});
  const kn=cx.map((v,i)=>v==null?-1:i).filter(i=>i>=0);
  if(kn.length<3)return null;
  const a=kn[0],b=kn[kn.length-1],step=(cx[b]-cx[a])/(b-a),X=cx.map((v,i)=>v==null?cx[a]+(i-a)*step:v);
  const hs=T.map(t=>t.h).sort((u,v)=>u-v),H=hs[hs.length>>1]||12,tol=Math.max(8,H*1.3),zone=X[0]-step*.4,lines=[];
  N.filter(w=>w.x<zone).sort((u,v)=>u.y-v.y).forEach(w=>{const l=lines[lines.length-1];if(l&&Math.abs(w.y-l.y)<H*.8){l.w.push(w);l.y=(l.y*(l.w.length-1)+w.y)/l.w.length;}else lines.push({y:w.y,w:[w]});});
  const out=[];let bad=0;
  lines.forEach(l=>{
    const nl=nrm(l.w.sort((u,v)=>u.x0-v.x0).map(w=>w.t).join(' '));
    if(nl.length<4)return;
    const s=st.find(x=>nrm(x.name)==nl)||st.find(x=>nl.includes(nrm(x.name)))||st.find(x=>lev(nl,nrm(x.name))<=Math.max(1,(nrm(x.name).length*.15)|0));
    if(!s)return;
    const rt=T.filter(t=>Math.abs(t.y-l.y)<=tol),ys=rt.map(t=>t.y).sort((u,v)=>u-v),ry=rt.length?ys[ys.length>>1]:l.y-H*.5,cells=[];
    X.forEach(cxi=>{
      const c=col(cxi-step*.2,ry);
      if(c===0){cells.push('0.00','0.00');return;}
      const s0=rt.find(t=>Math.abs(t.x-cxi)<=step*.25),en=rt.find(t=>t.x>cxi+step*.3&&t.x<cxi+step*.8);
      const sh=(s0&&s0.hh>0)?s0.hh:(c>0?c:null);
      if(sh==null||!en||en.hh<=sh){cells.push('?','?');bad++;return;}
      cells.push(sh+'.'+((s0&&s0.hh>0)?s0.mm:'00'),en.hh+'.'+en.mm);
    });
    out.push(s.name+';'+cells.join(';'));
  });
  return{text:out.join('\n'),n:out.length,bad:bad};
}
function cv(f,flt){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const w=Math.max(1800,im.width),c=document.createElement('canvas');c.width=w;c.height=Math.round(im.height*w/im.width);const x=c.getContext('2d',{willReadFrequently:true});if(flt){try{x.filter='grayscale(1) contrast(1.3)';}catch(e){}}x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c);};im.onerror=no;im.src=u;});}
async function readShift(f){
  if(typeof Tesseract==='undefined')throw new Error('Okuma modülü yüklenemedi');
  const c=await cv(f,true),raw=await cv(f,false),g=raw.getContext('2d');
  const r=await Tesseract.recognize(c,'tur',{logger:m=>{if(m.status)$('st').textContent='📖 Vardiya okunuyor… '+(m.progress?'%'+Math.round(m.progress*100):'');}});
  const W=(r.data.words||[]).filter(w=>w&&w.text&&w.text.trim()&&w.bbox).map(w=>({t:w.text.trim(),x0:w.bbox.x0,x:(w.bbox.x0+w.bbox.x1)/2,y:(w.bbox.y0+w.bbox.y1)/2,h:w.bbox.y1-w.bbox.y0}));
  const col=(x,y)=>{const d=g.getImageData(Math.max(0,Math.round(x)-2),Math.max(0,Math.round(y)-2),5,5).data;let R=0,G=0,B=0;for(let i=0;i<d.length;i+=4){R+=d[i];G+=d[i+1];B+=d[i+2];}const n=d.length/4;return hourOfRGB(R/n,G/n,B/n);};
  return gridShift(W,col,(D&&D.staff)||[]);
}

/* ===== Araçlar ===== */
function tok(){ask('Ntfy Token',[{label:'ntfy.sh hesabınızdaki token (tk_ ile başlar)'}],v=>{if(!v[0].trim())return;google.script.run.withFailureHandler(e=>msg(emsg(e))).withSuccessHandler(()=>msg('Token kaydedildi ✅')).saveToken(v[0],PIN);},'Kaydet');}
function code(id,name){google.script.run.withFailureHandler(e=>msg(emsg(e))).withSuccessHandler(t=>{msg(name+' için bildirim kodu:\n\n'+t+'\n\nntfy uygulamasında "+" ile bu kodu ekleyin.');}).getTopic(id,PIN);}
function test(id){google.script.run.withFailureHandler(e=>msg('Gönderilemedi:\n'+emsg(e))).withSuccessHandler(()=>msg('Test gönderildi ✅')).sendTest(id,PIN);}
function hist(id){
  google.script.run.withFailureHandler(e=>msg(emsg(e))).withSuccessHandler(h=>{
    if(!h.rows.length)return msg(nice(h.name)+'\nHenüz kayıtlı mola yok.');
    const g={};h.rows.forEach(r=>{const d=new Date(r[0]).toLocaleDateString('tr-TR');(g[d]=g[d]||[]).push(r);});
    msg(nice(h.name)+'\n'+Object.keys(g).map(d=>'\n'+d+'  (toplam '+g[d].reduce((a,r)=>a+r[2],0)+' dk)\n'+g[d].map(r=>'  '+hm(r[0])+'–'+hm(r[3]||r[0]+r[2]*60000)+'  '+kn(r[1])+'  ('+r[2]+' dk)').join('\n')).join('\n'));
  }).getHistory(id,PIN);
}

/* ===== Sesli anons (yönetici ekranı) ===== */
let REPEAT_MS=25000,MAX_REPEAT=6,VOICE=null,SPOKEN={};
function pickVoice(){if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices().filter(v=>/^tr/i.test(v.lang));VOICE=vs.find(v=>/tolga|cem|erkek|ahmet/i.test(v.name))||vs[0]||null;}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(text){if(!('speechSynthesis' in window))return false;try{const u=new SpeechSynthesisUtterance(text);u.lang='tr-TR';if(VOICE)u.voice=VOICE;u.rate=1.1;u.pitch=0.55;u.volume=1;speechSynthesis.speak(u);return true;}catch(e){return false;}}
function siren(){try{if(!ac)return;for(let i=0;i<3;i++){const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=i%2?700:1100;g.gain.value=.35;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+i*.2);o.stop(ac.currentTime+i*.2+.16);}}catch(e){}}
function announce(s){siren();setTimeout(()=>speak(nice(s.name)+', molan bitti! Çabuk postana geç!'),650);}
function voiceTest(){perm(true);pickVoice();siren();setTimeout(()=>{if(!speak('Ahmet Polat, molan bitti! Çabuk postana geç!'))msg('Bu tarayıcı sesli okumayı desteklemiyor.');},650);}
document.addEventListener('click',()=>{if(window.__unlocked)return;window.__unlocked=1;try{speechSynthesis.speak(new SpeechSynthesisUtterance(''));}catch(e){}});
async function wake(on){try{if(on){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null;});return true;}if(WL){await WL.release();WL=null;}}catch(e){return false;}return false;}
document.addEventListener('visibilitychange',()=>{if(ANONS&&document.visibilityState==='visible'&&!WL)wake(true);});
async function anons(){
  ANONS=!ANONS;
  if(ANONS){perm(true);pickVoice();MAX_REPEAT=40;const ok=await wake(true);head();siren();if(!ok)msg('Ekran otomatik açık tutulamadı.\nTelefonun Ayarlar > Ekran > Ekran zaman aşımı seçeneğini en uzun yapın ve şarjda bırakın.');}
  else{MAX_REPEAT=6;await wake(false);head();}
}

/* ===== Sayaç + yanıp sönme ===== */
function tick(){
  if(!D)return;
  const now=Date.now()+off;let late=false;
  document.querySelectorAll('.card[data-id]').forEach(el=>{
    const s=D.staff.find(x=>x.id==el.dataset.id),a=s&&s.active;
    if(!a)return;
    const r=endOf(a)-(a.paused?a.pausedAt:now),ab=Math.abs(r);
    const t=el.querySelector('.tm');if(t)t.textContent=(a.paused?'⏸ ':'')+(r<0?'+':'')+p(ab/60000|0)+':'+p(ab/1000%60|0);
    const lt=!a.paused&&r<0;
    el.classList.toggle('late',lt);el.classList.toggle('pz',!!a.paused);
    if(lt){
      late=true;
      const key=s.id+a.start+(a.pt||0);
      if(!alerted[key]){alerted[key]=1;alarm(s);}
      const sp=SPOKEN[key]||(SPOKEN[key]={n:0,t:0});
      if(M=='y'&&sp.n<MAX_REPEAT&&Date.now()-sp.t>REPEAT_MS){sp.n++;sp.t=Date.now();announce(s);}
      if(!a.notified&&(!chk[key]||Date.now()-chk[key]>20000)){chk[key]=Date.now();google.script.run.withFailureHandler(()=>{}).checkBreaks();}
    }
  });
  document.body.classList.toggle('alarm',late);
  if(!late)document.title='Mola Takip';
}
function perm(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}try{Notification.requestPermission();}catch(e){}}
function alarm(s){
  document.title='🔴 MOLA DOLDU: '+s.name;
  try{navigator.vibrate&&navigator.vibrate([800,300,800,300,800,300,800]);}catch(e){}
  try{if(Notification.permission=='granted')new Notification('⏰ Mola doldu',{body:s.name+', molan bitti! Çabuk postana geç.',requireInteraction:true});}catch(e){}
}
load();
setInterval(tick,1000);
setInterval(()=>{if($('ov').hidden)load();},5000);
</script>
