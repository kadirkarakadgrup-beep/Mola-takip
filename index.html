<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d6f42">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Servis">
<title>Servis Takip</title>
<style>
:root{--bg:#f3f0e8;--card:#fff;--tx:#1c1b18;--mut:#706c62;--bd:#d9d4c7;--ac:#1d6f42;--acbg:#e1f1e8;--alt:#f8f6f0;--dng:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--card:#1c1c1a;--tx:#ecebe6;--mut:#9b978c;--bd:#38362f;--ac:#52c488;--acbg:#1d3a2b;--alt:#222220;--dng:#f2837b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#app{max-width:520px;margin:0 auto;padding:14px}
.hero{background:linear-gradient(135deg,#1d6f42,#2f8f5b);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
.hero h1{margin:0;font-size:22px}.hero p{margin:2px 0 0;opacity:.9;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--mut);font-weight:600}
.nav{display:flex;gap:8px}
.nav button,.btn{border:1.5px solid var(--bd);background:transparent;color:var(--tx);border-radius:10px;padding:11px 14px;font-size:16px}
.nav input,.note,.url{font:inherit;padding:11px;border:1.5px solid var(--bd);border-radius:10px;background:transparent;color:var(--tx)}
.nav input{flex:1;min-width:0}
.note,.url{width:100%;margin-top:12px}
.big{font-size:19px;font-weight:700;margin:10px 0 2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1.5px solid var(--bd);background:transparent;color:var(--tx);padding:11px 16px;border-radius:999px;font-size:16px}
.chip.on{background:var(--acbg);border-color:var(--ac);color:var(--ac);font-weight:700}
.chip.add{border-style:dashed;color:var(--mut)}
.save{width:100%;margin-top:14px;background:var(--ac);border:0;color:#fff;border-radius:12px;padding:14px;font-size:18px;font-weight:700}
.save.dirty{background:#c77700}
.save:disabled{opacity:.6}
.wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:360px;font-size:14px}
th{background:#1d6f42;color:#fff;text-align:left;padding:8px 10px;border:1px solid var(--bd)}
td{padding:8px 10px;border:1px solid var(--bd)}
tr:nth-child(even) td{background:var(--alt)}
tr.cur td{outline:2px solid var(--ac);outline-offset:-2px}
td.e{color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.d{color:var(--dng)}
#stt{font-size:13px;color:var(--mut);margin-top:8px;min-height:18px}
#stt.ok{color:var(--ac)}#stt.er{color:var(--dng)}
</style>
</head>
<body>
<div id="app">
<div class="hero"><h1>🚌 Servis Takip</h1><p id="sub">Personel servis güzergahları, gün gün</p></div>

<div class="card" id="setup" hidden>
<h2>Ortak kayıt kurulumu</h2>
<div style="font-size:14px">Herkesin aynı kayıtları görmesi için Firebase Realtime Database adresini yapıştırın (örn. https://proje-default-rtdb.firebaseio.com).</div>
<input class="url" id="fbu" placeholder="https://....firebaseio.com">
<div class="row"><button class="btn p" id="fbb">Bağlan</button></div>
</div>

<div class="card">
<h2>Tarih</h2>
<div class="nav"><button id="pv">‹</button><input type="date" id="dp"><button id="nx">›</button></div>
<div class="big" id="lb"></div>
<div class="chips" id="ch"></div>
<input class="note" id="nt" placeholder="Not (servis, plaka, şoför…)">
<button class="save" id="sv">Kaydet</button>
<div id="stt"></div>
<div class="row"><button class="btn d" id="clr">Bu günü temizle</button><button class="btn" id="tod">Bugün</button></div>
</div>

<div class="card">
<h2 id="wt">Haftalık tablo</h2>
<div class="wrap"><table><thead><tr><th>Tarih</th><th>Gün</th><th>Güzergah</th><th>Not</th></tr></thead><tbody id="tb"></tbody></table></div>
<div class="row"><button class="btn p" id="cw">Haftayı kopyala (Excel)</button><button class="btn" id="ca">Tüm kayıtları kopyala</button></div>
</div>
</div>
<script>
// Firebase Realtime Database adresini buraya yazın (sonunda / olmasın). Boşsa uygulama içinden sorulur.
var FB="https://servis-takip-d7697-default-rtdb.europe-west1.firebasedatabase.app";
var G=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
var LS="servisTakip2",DR=["Buca","Torbalı","Ayrancılar"];
var st={routes:DR.slice(),days:{}},draft={r:[],n:""},dirty=false,busy=false;
try{var raw=localStorage.getItem(LS);if(raw)st=JSON.parse(raw)}catch(e){}
try{if(!FB)FB=localStorage.getItem(LS+"u")||""}catch(e){}
if(!st.routes||!st.routes.length)st.routes=DR.slice();if(!st.days)st.days={};
var $=function(i){return document.getElementById(i)};
function p2(n){return ("0"+n).slice(-2)}
function iso(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function parse(s){var a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2])}
function fmt(d){return p2(d.getDate())+"."+p2(d.getMonth()+1)+"."+d.getFullYear()}
function add(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function monday(d){return add(d,-((d.getDay()+6)%7))}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function norm(o){return {r:(o&&o.r)?o.r.filter(Boolean):[],n:(o&&o.n)||""}}
function loc(){try{localStorage.setItem(LS,JSON.stringify(st))}catch(e){}}
function say(t,c){var s=$("stt");s.textContent=t;s.className=c||""}
var cur=iso(new Date());
function load(){var o=norm(st.days[cur]);draft={r:o.r.slice(),n:o.n}}
function net(path,method,body){
return fetch(FB.replace(/\/+$/,"")+path+".json",{method:method||"GET",body:body}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
function pull(){
if(!FB||busy)return;
Promise.all([net("/days"),net("/routes")]).then(function(a){
var d={};if(a[0])Object.keys(a[0]).forEach(function(k){d[k]=norm(a[0][k])});
st.days=d;
if(a[1]&&a[1].length)st.routes=a[1].filter(Boolean);
loc();if(!dirty)load();draw();
$("sub").textContent="Ortak kayıt açık · herkes aynı kayıtları görür"}).catch(function(){
$("sub").textContent="Bağlantı yok · kayıtlar bu cihazda"})}
function save(){
var o=norm(draft),empty=!o.r.length&&!o.n;
if(empty)delete st.days[cur];else st.days[cur]=o;
loc();
var hh=new Date();hh=p2(hh.getHours())+":"+p2(hh.getMinutes());
if(!FB){dirty=false;say("Bu cihaza kaydedildi "+hh+" (ortak kayıt için Firebase adresi gerekli)","ok");draw();return}
busy=true;$("sv").disabled=true;say("Kaydediliyor…");
net("/days/"+cur,empty?"DELETE":"PUT",empty?undefined:JSON.stringify(o)).then(function(){
dirty=false;say("✓ Kaydedildi "+hh+" · herkes görebilir","ok")}).catch(function(){
say("Kaydedilemedi. İnterneti ve Firebase kurallarını kontrol edin.","er")}).then(function(){
busy=false;$("sv").disabled=false;draw()})}
function draw(){
var d=parse(cur);
$("dp").value=cur;
$("lb").textContent=G[d.getDay()]+", "+fmt(d);
var h="";
st.routes.forEach(function(r){var on=draft.r.indexOf(r)>-1;
h+='<button class="chip'+(on?' on':'')+'" data-r="'+esc(r)+'">'+(on?'✓ ':'')+esc(r)+'</button>'});
h+='<button class="chip add" id="ad">+ Güzergah</button>';
$("ch").innerHTML=h;
if(document.activeElement!==$("nt"))$("nt").value=draft.n;
var sv=$("sv");sv.textContent=dirty?"Kaydet (değişiklik var)":"Kaydet";sv.className="save"+(dirty?" dirty":"");
$("setup").hidden=!!FB;
var m=monday(d);
$("wt").textContent="Hafta: "+fmt(m)+" – "+fmt(add(m,5));
var t="";
for(var i=0;i<6;i++){var x=add(m,i),k=iso(x),o=norm(st.days[k]),v=o.r.join(" - ");
t+='<tr'+(k===cur?' class="cur"':'')+'><td>'+fmt(x)+'</td><td>'+G[x.getDay()]+'</td><td'+(v?'':' class="e"')+'>'+(esc(v)||'—')+'</td><td>'+esc(o.n)+'</td></tr>'}
$("tb").innerHTML=t}
function go(n){
if(dirty){var q=true;try{q=confirm("Kaydedilmemiş değişiklik var. Kaydedilsin mi?")}catch(e){}if(q)save()}
cur=n;load();dirty=false;say("");draw()}
$("ch").addEventListener("click",function(e){
var c=e.target.closest(".chip");if(!c)return;
if(c.id==="ad"){var n;try{n=prompt("Yeni güzergah adı:")}catch(x){}
n=(n||"").trim();if(n&&st.routes.indexOf(n)<0){st.routes.push(n);loc();if(FB)net("/routes","PUT",JSON.stringify(st.routes)).catch(function(){});draw()}return}
var r=c.dataset.r,k=draft.r.indexOf(r);
if(k>-1)draft.r.splice(k,1);else draft.r.push(r);
draft.r.sort(function(a,b){return st.routes.indexOf(a)-st.routes.indexOf(b)});
dirty=true;say("");draw()});
$("nt").addEventListener("input",function(){draft.n=$("nt").value;dirty=true;var s=$("sv");s.textContent="Kaydet (değişiklik var)";s.className="save dirty"});
$("sv").onclick=save;
$("dp").onchange=function(){if($("dp").value)go($("dp").value)};
$("pv").onclick=function(){go(iso(add(parse(cur),-1)))};
$("nx").onclick=function(){go(iso(add(parse(cur),1)))};
$("tod").onclick=function(){go(iso(new Date()))};
$("clr").onclick=function(){draft={r:[],n:""};$("nt").value="";dirty=true;draw()};
$("fbb").onclick=function(){var v=$("fbu").value.trim();if(!/^https:\/\/.+/.test(v))return;FB=v;try{localStorage.setItem(LS+"u",v)}catch(e){}pull();draw()};
function cp(s,ok){try{navigator.clipboard.writeText(s).then(function(){say(ok,"ok")},function(){say("Kopyalanamadı. Tablonun ekran görüntüsünü alın.","er")})}catch(x){say("Kopyalanamadı. Tablonun ekran görüntüsünü alın.","er")}}
function line(k){var x=parse(k),o=norm(st.days[k]);return fmt(x)+"\t"+G[x.getDay()]+"\t"+o.r.join(" - ")+"\t"+o.n+"\n"}
$("cw").onclick=function(){var m=monday(parse(cur)),s="Tarih\tGün\tGüzergah\tNot\n";for(var i=0;i<6;i++)s+=line(iso(add(m,i)));cp(s,"Hafta kopyalandı. Excel’e yapıştırın.")};
$("ca").onclick=function(){var s="Tarih\tGün\tGüzergah\tNot\n";Object.keys(st.days).sort().forEach(function(k){s+=line(k)});cp(s,"Tüm kayıtlar kopyalandı.")};
load();draw();pull();
setInterval(pull,6000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)pull()});
</script>
</body>
</html>
